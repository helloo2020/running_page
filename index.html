<!doctype html>
<html lang="en"> 
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#fdfdfb" />
    <script>(function(){var t='light';try{if(localStorage.getItem('scond-running-theme')==='dark')t='dark';}catch(e){}document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#1d1c1a':'#fdfdfb';})();</script>
    <script>
      (function() {
        const basePath = "%BASE_URL%";
        const redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          if (redirect !== basePath + '/' && redirect !== basePath + '/index.html') {
            window.history.pushState(null, '', redirect);
          }
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/helloo2020/running_page/master/src/static/duola.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Running Page</title>
  </head>
  <body>
    <div id="root"></div>
    <footer style="margin:32px auto 16px;padding:16px;text-align:center;font:12px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--muted);">
      <span data-visit-count>run.scond.me · 统计加载中</span>
    </footer>
    <script src="https://scond.me/visit-counter.js" data-site="run.scond.me" data-endpoint="https://scond.me/api/visit" data-target="[data-visit-count]" data-increment="true" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
